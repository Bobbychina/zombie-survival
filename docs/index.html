化服。"},lore:["l_lab"]}},Rt={door:{n:"加固门窗",icon:"🚪",max:3,cost:{wood:4,metal:3},desc:"夜间尸潮伤害减免，每级 -25%。"},bed:{n:"行军床",icon:"🛏️",max:3,cost:{cloth:4,wood:2},desc:"睡觉恢复更多生命与体力。"},filter:{n:"净水装置",icon:"🚰",max:3,cost:{metal:3,chip:2,tape:1},desc:"每天产出净水，等级越高越多。"},garden:{n:"屋顶菜园",icon:"🌱",max:3,cost:{wood:2,cloth:1,can:1},desc:"每天产出食物。"},bench:{n:"工作台",icon:"🛠️",max:3,cost:{metal:3,wood:2,tape:1},desc:"解锁制作配方，等级越高配方越多。"},storage:{n:"储物箱",icon:"📦",max:3,cost:{metal:3,wood:3},desc:"提供基地储物格，离家时不用背着。"},radio:{n:"无线电",icon:"📻",max:1,cost:{chip:3,metal:3,tape:2},desc:"解锁“方舟实验室”坐标与更多商人来访。"},wall:{n:"围墙工事",icon:"🧱",max:2,cost:{wood:6,metal:5},desc:"尸潮时提供掩体，减少资源损失。"},pond:{n:"鱼塘",icon:"🐟",max:3,cost:{wood:4,cloth:2,metal:1},desc:"每天产鱼；投喂鱼饵/蔬菜能翻倍，冬天减产。"}},Xn=[{out:"bandage",n:2,need:{cloth:2},bench:0,desc:"撕成条，煮沸，晾干。"},{out:"water",n:1,need:{dirty:2,wood:1},bench:0,desc:"煮沸消毒，去掉大部分病原。"},{out:"molotov",n:1,need:{bottle:1,fuel:1,cloth:1},bench:1,desc:"布条塞瓶口，点火就扔。"},{out:"tape",n:1,need:{cloth:1,chem:1},bench:1,desc:"劣质胶带，但能粘住东西。"},{out:"ammo",n:10,need:{powder:2,metal:1,tape:1},bench:2,desc:"复装弹药 ×10（自制，易哑火）。"},{out:"medkit",n:1,need:{bandage:2,anti:1,tape:1},bench:2,desc:"凑齐一套急救物资。"},{out:"antitoxin",n:1,need:{chem:2,water:1},bench:2,desc:"用化学药剂中和毒素。"},{out:"grenade",n:1,need:{powder:3,metal:2,tape:1},bench:3,desc:"自制破片手雷，威力有限但够用。"},{out:"serum",n:1,need:{chem:3,anti:1,chip:1},bench:3,desc:"低配版病毒抑制剂。"}],qe={shoot:{n:"射击",icon:"🎯",desc:"枪械伤害 +6%/级，暴击率提升。"},melee:{n:"近战",icon:"🔪",desc:"近战伤害 +7%/级，体力消耗 -3%/级。"},survival:{n:"生存",icon:"🔥",desc:"搜刮收益 +8%/级，食物与水消耗 -3%/级。"},medic:{n:"医疗",icon:"💉",desc:"治疗效果 +8%/级，感染增长 -5%/级。"},fitness:{n:"体能",icon:"💪",desc:"负重上限 +6/级，体力上限 +5/级。"},stealth:{n:"潜行",icon:"🌑",desc:"遭遇率 -4%/级，逃跑成功率提升。"}},Mt={vet:{n:"老兵 · 霍克",dmg:9,hp:70,desc:"每回合稳定输出，擅长枪械。"},nurse:{n:"护士 · 林",dmg:4,hp:50,desc:"每回合为你恢复少量生命。"},hunter:{n:"猎手 · 阿蛮",dmg:7,hp:60,desc:"提高搜刮收益，发现更多秘闻。"}},Kn=[{id:"medkit",cost:34,stock:2},{id:"ammo",n:15,cost:30,stock:3},{id:"can",n:3,cost:22,stock:2},{id:"water",n:3,cost:22,stock:2},{id:"anti",n:2,cost:30,stock:1},{id:"gasmask",cost:70,stock:1},{id:"hazmat",cost:120,stock:1},{id:"kevlar",cost:110,stock:1},{id:"grenade",n:2,cost:60,stock:1},{id:"machete",cost:60,stock:1},{id:"shotgun",cost:130,stock:1},{id:"marksman",cost:210,stock:1}],bt=[{id:"l_company",n:"破坏伞公司",story:`「破坏伞公司」—— 末日之前全球最大的生物科技企业。

表面上是医药巨头，暗地里却在从事违法的病毒武器研究。总部设在市中心地下，拥有全球最先进的生物实验室。

末日后，幸存者们传言：破坏伞公司的最高机密实验室里，保存着"芥末"病毒的唯一解药。也有人说，那是他们用来制造更可怕生物的场所……`},{id:"l_virus",n:'"芥末"病毒',story:`全称 "Genetically Accelerated Mutagenic Organism Transmission"，简称 G.A.M.O.T.，代号"芥末"。

一种人工设计的 RNA 病毒，能大幅加速细胞分裂与突变。原本为军事目的设计——创造超级士兵。

但它有个致命副作用：感染后期破坏大脑前额叶，宿主失去理性，只剩原始攻击本能。这就是"丧尸"的由来。`},{id:"l_lab",n:"秘密实验室「方舟」",story:`破坏伞公司最高机密实验室，代号"方舟"。

位于市中心地下 200 米，共 7 层防护门，每层需要不同的生物识别信息。传闻核心区域——第 7 层——保存着"芥末"病毒的唯一解药。

但最近有传言说，实验室的自动防御系统仍在运行……而且有两只特殊的巨型丧尸被锁在第 6 层，它们似乎保留着某种程度的智能。`},{id:"l_outbreak",n:"末日的开端",story:`X-Day，末日第一天。

一切都始于"方舟"实验室的一次"轻微泄漏"。公司高层试图掩盖真相，将事故定性为"局部污染"。

当第一个感染者在市中心商业区失去控制时，一切都太晚了。病毒在 72 小时内扩散全城。军队的反应太慢、太弱。一周后，通讯彻底中断。

这就是"旧世界"的终结。`},{id:"l_evo",n:"丧尸进化论",story:`「芥末」病毒有一个令人恐惧的特性：它每隔一段时间就会发生群体性进化。

大约每 5 天，所有感染者同步变异一次——更快、更强、更顽强。科学家推测这是病毒群体智能的表现。

更可怕的是，这种进化似乎也影响幸存者。许多人报告身体素质同步增强……仿佛病毒也在试图"平衡"这场博弈。`},{id:"l_tech",n:"旧世界的科技",story:`末日之前，人类的技术已经达到惊人的高度。

智能手机、人工智能、基因编辑、量子计算……但在末日面前脆弱得可笑。电网瘫痪后，一切退回了蒸汽时代之前。

不过仍有"旧世界的遗产"在废墟里等着被发现——太阳能板、无线电设备、医疗扫描仪……甚至破坏伞公司遗留的武器原型。`},{id:"l_survivors",n:"幸存者网络",story:`末日并不意味着文明的终结。

仍有大大小小的幸存者营地散落在各地，通过无线电、信使和偶尔运作的节点保持联系。

<body>
<div id="app">
  <div id="hazard"></div>
  <header id="topbar">
    <div class="brand"><span class="mark">⛔</span>丧尸末日生存<span class="ver">v3.0 余烬</span></div>
    <div id="clock"><span>第 <b id="clock-day">1</b> 天</span><span class="phase" id="clock-phase">白天</span></div>

    <div class="tools">
      <button class="icobtn" id="btn-sfx" title="音效开关">🔊</button>
      <button class="icobtn" id="btn-help" title="帮助 / 快捷键">?</button>
      <button class="icobtn" id="btn-menu" title="菜单：存档 / 新游戏">☰</button>
    </div>
  </header>
  <div id="hud"></div>
  <nav id="tabs"></nav>
  <div id="body">
    <main id="view"></main>
    <aside id="side">
      <div id="side-head"><span>现场日志</span><button class="btn xs ghost" id="btn-clear-log">清空</button></div>
      <div id="log"></div>
    </aside>
  </div>
</div>
<div id="daytint"></div>
<div id="overlay-root"></div>
<div id="fx"></div>
<div id="toasts"></div>
</body>
