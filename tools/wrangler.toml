# Cloudflare Worker 声明式配置：dsh-oauth-relay（账号/云存档 + GitHub OAuth 中继）
# 用法：cd tools && npx wrangler login && npx wrangler deploy
# 全部内容都是「标识符」而非凭据：account_id / namespace id 没有 API Token 谁也动不了。
# 唯一真依赖是 wrangler（用 npx 跑，不需要装进 package.json）和一次交互式登录。
name = "dsh-oauth-relay"
main = "cf-worker.js"
compatibility_date = "2025-09-01"

# 账号不写死：wrangler 会取当前登录账号，fork 的人不用改文件就能部到自己账号下。
# 本站线上用的是这个（多账号环境下取消注释或跑 CLOUDFLARE_ACCOUNT_ID=... npx wrangler deploy）：
# account_id = "52a13b49136fb7a37a74fc8093ee1897"

# 面板里手工加的变量/机密（DSH_PEPPER、GH_CLIENT_SECRET）在部署时保留，别被本次覆盖掉
keep_vars = true

# 关掉预览 URL（面板里原本就是关的），否则 wrangler 部署会默认打开
preview_urls = false

# 保留面板里的日志/追踪设置：grep 线上问题时全靠它
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true

# KV 绑定：env.DSH_KV —— 代码里读写存档、账号记录都走它
[[kv_namespaces]]
binding = "DSH_KV"
id = "55c168162fc8475990ba74b5a728003f"

# 页面访问计数（env.AE）：写 Analytics Engine，不占 KV 每天 1000 次的写额度。
# 查数据：Cloudflare 面板 → Workers & Pages → Analytics Engine → 选 dataset site_hits → SQL：
#   SELECT index1 AS page, count() AS views, count(DISTINCT blob2) AS refs
#   FROM site_hits WHERE timestamp > NOW() - INTERVAL '7' DAY GROUP BY page ORDER BY views DESC
[[analytics_engine_datasets]]
binding = "AE"
dataset = "site_hits"
