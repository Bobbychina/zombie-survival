表面上是医药巨头，暗地里却在从事违法的病毒武器研究。总部设在市中心地下，拥有全球最先进的生物实验室。

末日后，幸存者们传言：破坏伞公司的最高机密实验室里，保存着"芥末"病毒的唯一解药。也有人说，那是他们用来制造更可怕生物的场所……`},{id:"l_virus",n:'"芥末"病毒',story:`全称 "Genetically Accelerated Mutagenic Organism Transmission"，简称 G.A.M.O.T.，代号"芥末"。

一种人工设计的 RNA 病毒，能大幅加速细胞分裂与突变。原本为军事目的设计——创造超级士兵。

但它有个致命副作用：感染后期破坏大脑前额叶，宿主失去理性，只剩原始攻击本能。这就是"丧尸"的由来。`},{id:"l_lab",n:"秘密实验室「方舟」",story:`破坏伞公司最高机密实验室，代号"方舟"。

位于市中心地下 200 米，共 7 层防护门，每层需要不同的生物识别信息。传闻核心区域——第 7 层——保存着"芥末"病毒的唯一解药。

但最近有传言说，实验室的自动防御系统仍在运行……而且有两只特殊的巨型丧尸被锁在第 6 层，它们似乎保留着某种程度的智能。`},{id:"l_outbreak",n:"末日的开端",story:`X-Day，末日第一天。

一切都始于"方舟"实验室的一次"轻微泄漏"。公司高层试图掩盖真相，将事故定性为"局部污染"。

当第一个感染者在市中心商业区失去控制时，一切都太晚了。病毒在 72 小时内扩散全城。军队的反应太慢、太弱。一周后，通讯彻底中断。

这就是"旧世界"的终结。`},{id:"l_evo",n:"丧尸进化论",story:`「芥末」病毒有一个令人恐惧的特性：它每隔一段时间就会发生群体性进化。

大约每 5 天，所有感染者同步变异一次——更快、更强、更顽强。科学家推测这是病毒群体智能的表现。

更可怕的是，这种进化似乎也影响幸存者。许多人报告身体素质同步增强……仿佛病毒也在试图"平衡"这场博弈。`},{id:"l_tech",n:"旧世界的科技",story:`末日之前，人类的技术已经达到惊人的高度。

智能手机、人工智能、基因编辑、量子计算……但在末日面前脆弱得可笑。电网瘫痪后，一切退回了蒸汽时代之前。

不过仍有"旧世界的遗产"在废墟里等着被发现——太阳能板、无线电设备、医疗扫描仪……甚至破坏伞公司遗留的武器原型。`},{id:"l_survivors",n:"幸存者网络",story:`末日并不意味着文明的终结。

仍有大大小小的幸存者营地散落在各地，通过无线电、信使和偶尔运作的节点保持联系。

这些营地各有规则与文化：有些军事化管制，有些保留着末日前的民主。他们偶尔冲突，但大多数时候明白——真正的敌人不是彼此。`},{id:"l_military",n:"军方最后通讯",story:`末日第 14 天，军方发出最后一段广播：

"这里是『铁锤』基地。我们正在失去城市北部的控制。感染者数量预计超过百万。我们即将启动『净空协议』……愿上帝保佑我们所有人。"

广播结束后，城市北部传来巨大爆炸。军方用空袭摧毁了整个城区。但即便这样，也没能阻止病毒扩散。

从那以后，再无军方的任何消息……`},{id:"l_patient0",n:"零号病人之谜",story:`关于第一个感染者——零号病人——的信息少之又少。

破坏伞公司内部档案显示，零号病人是一名 35 岁的流浪汉，被公司以"临床试验"名义招募。他注射的并不是"芥末"病毒本身，而是一种早期、不稳定的版本。

有传言说，零号病人并没有死。他可能仍在某处游荡……或者，他已经进化成了某种完全不同、更可怕的东西。`},{id:"l_the_one",n:"医生的日记",story:`（一份在你苏醒的医院里找到的褪色日记本）

"第 47 天。我是这家医院最后的医生了。

今天有一个受伤的男人被送到门口。他的手臂被咬伤，但我们还是把他带了进来。我给他做了截肢，用了最后的麻醉剂。

他昏迷中不停重复同一个词：『方舟』。他说那里有答案。

他醒来后告诉我，他是从破坏伞公司逃出来的研究员。他说公司在地下实验室做的那些事……不是人该做的。他说解药真的存在。

然后他死了。

我不知道还能坚持多久。但我要把消息传下去。如果有人读到这段话——去方舟实验室，找到解药。"

—— 日记的主人如今不知所踪。你把这些话记在了心里。`},{id:"l_ark",n:"方舟协议",story:`（无线电截获的加密通话，反复播放）

"……第 6 层隔离失效，实验体 A、B 苏醒。它们会叫。

重复：它们会叫。不要回应任何呼叫。

如果还有活人听到这段——解药在 7 层冷柜，密码是医生工号。别带枪下去，会引来更多。"

通话到此中断。信号源已经沉默了 400 多天。`},{id:"l_end",n:"余烬",story:`（你写在日记最后一页的话）

"如果这段文字被人读到，说明我至少活到了写下它的那一刻。
