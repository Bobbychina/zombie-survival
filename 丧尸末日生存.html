射击",icon:"🎯",desc:"枪械伤害 +6%/级，暴击率提升。"},melee:{n:"近战",icon:"🔪",desc:"近战伤害 +7%/级，体力消耗 -3%/级。"},survival:{n:"生存",icon:"🔥",desc:"搜刮收益 +8%/级，食物与水消耗 -3%/级。"},medic:{n:"医疗",icon:"💉",desc:"治疗效果 +8%/级，感染增长 -5%/级。"},fitness:{n:"体能",icon:"💪",desc:"负重上限 +6/级，体力上限 +5/级。"},stealth:{n:"潜行",icon:"🌑",desc:"遭遇率 -4%/级，逃跑成功率提升。"}},Oe={vet:{n:"老兵 · 霍克",dmg:9,hp:70,desc:"每回合稳定输出，擅长枪械。"},nurse:{n:"护士 · 林",dmg:4,hp:50,desc:"每回合为你恢复少量生命。"},hunter:{n:"猎手 · 阿蛮",dmg:7,hp:60,desc:"提高搜刮收益，发现更多秘闻。"}},la=[{id:"medkit",cost:34,stock:2},{id:"ammo",n:15,cost:30,stock:3},{id:"can",n:3,cost:22,stock:2},{id:"water",n:3,cost:22,stock:2},{id:"anti",n:2,cost:30,stock:1},{id:"gasmask",cost:70,stock:1},{id:"hazmat",cost:120,stock:1},{id:"kevlar",cost:110,stock:1},{id:"grenade",n:2,cost:60,stock:1},{id:"machete",cost:60,stock:1},{id:"shotgun",cost:130,stock:1},{id:"marksman",cost:210,stock:1}],ye=[{id:"l_company",n:"破坏伞公司",story:`「破坏伞公司」—— 末日之前全球最大的生物科技企业。

表面上是医药巨头，暗地里却在从事违法的病毒武器研究。总部设在市中心地下，拥有全球最先进的生物实验室。

末日后，幸存者们传言：破坏伞公司的最高机密实验室里，保存着"芥末"病毒的唯一解药。也有人说，那是他们用来制造更可怕生物的场所……`},{id:"l_virus",n:'"芥末"病毒',story:`全称 "Genetically Accelerated Mutagenic Organism Transmission"，简称 G.A.M.O.T.，代号"芥末"。

一种人工设计的 RNA 病毒，能大幅加速细胞分裂与突变。原本为军事目的设计——创造超级士兵。

但它有个致命副作用：感染后期破坏大脑前额叶，宿主失去理性，只剩原始攻击本能。这就是"丧尸"的由来。`},{id:"l_lab",n:"秘密实验室「方舟」",story:`破坏伞公司最高机密实验室，代号"方舟"。

位于市中心地下 200 米，共 7 层防护门，每层需要不同的生物识别信息。传闻核心区域——第 7 层——保存着"芥末"病毒的唯一解药。

但最近有传言说，实验室的自动防御系统仍在运行……而且有两只特殊的巨型丧尸被锁在第 6 层，它们似乎保留着某种程度的智能。`},{id:"l_outbreak",n:"末日的开端",story:`X-Day，末日第一天。

一切都始于"方舟"实验室的一次"轻微泄漏"。公司高层试图掩盖真相，将事故定性为"局部污染"。

当第一个感染者在市中心商业区失去控制时，一切都太晚了。病毒在 72 小时内扩散全城。军队的反应太慢、太弱。一周后，通讯彻底中断。

这就是"旧世界"的终结。`},{id:"l_evo",n:"丧尸进化论",story:`「芥末」病毒有一个令人恐惧的特性：它每隔一段时间就会发生群体性进化。
